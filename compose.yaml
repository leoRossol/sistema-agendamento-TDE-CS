services:
  # Database
  mysql:
    image: 'mysql:8.0'
    container_name: sistema-agendamento-mysql
    environment:
      - 'MYSQL_DATABASE=sistema_agendamento'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=agendamento_user'
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
#      - ./seed/data.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - agendamento-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Eureka Server (Service Discovery)
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: sistema-agendamento-eureka
    ports:
      - "8761:8761"
    networks:
      - agendamento-network
    restart: on-failure

  # Reports Service (Microserviço de Relatórios)
  reports-svc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-agendamento-reports
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sistema_agendamento
      - SPRING_DATASOURCE_USERNAME=agendamento_user
      - SPRING_DATASOURCE_PASSWORD=secret
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=bac994f97a543496598f5a167ff9344c2e964c61e0eee090b49cb4de57bfe785
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - agendamento-network
    restart: on-failure

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: sistema-agendamento-gateway
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_started
      reports-svc:
        condition: service_started
    networks:
      - agendamento-network
    restart: on-failure

  # Prometheus - Coleta de Métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: sistema-agendamento-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - agendamento-network
    depends_on:
      - reports-svc

  # Grafana - Visualização de Métricas
  grafana:
    image: grafana/grafana:latest
    container_name: sistema-agendamento-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - agendamento-network
    depends_on:
      - prometheus

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  agendamento-network:
    driver: bridge
